<!doctype html>
<!--
  ベンチ盤面: **実ブラウザ + 実 web ページの形**を offline で決定的に再現する。

  なぜ要るか(2026-08-16 に測って分かったこと): 曖昧ラベル注記の最大の発生源は
  `browser` アーキタイプ(固定コーパス14枚の平均 682B。次点の ec 646B・map 421B)なのに、
  ベンチの盤面10個に **browser は1つも無かった**。最も近い `cmp-webview-grid` は
  自前アプリの WebView で、しかも表の値がすべて異なるので**この注記がほとんど出ない**。
  測れない形について「注記が効いているか」は決められない。

  再現する形(外部評価で苦情の出た Yahoo 天気トップ・`ios-browser_yahoo_top` の実測):
    ・同じ値が地点をまたいで何度も出る(降水確率・気温・天気)= 曖昧ラベルの塊
    ・セルが**ラベルを持たないアンカー**で入れ子になっている(実測では 120 要素中 47)
    ・結果として**書けるセレクタが無い要素が過半**(実測 64/120 = 53%)
  **値を全部ユニークにしないこと** —— それをやると盤面の目的が消える。

  実ページと違って**中身が変わらない**のがこのファイルの存在理由(手数の A/B は
  盤面が動くと比較できない)。配信は Bench/README の「browser 盤面の立て方」参照。
-->

</head>
