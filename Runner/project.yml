# xcodegen 定義。`cd Runner && xcodegen generate` で FTesterRunner.xcodeproj を生成する。
# 生成物はコミットしない(.gitignore 済み)。
name: FTesterRunner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    # 実機ビルドでは自動署名のためにチーム固有の bundle id が要る。ホスト側 BridgeLauncher が
    # xcodebuild の引数で上書きする(既定 com.example のままだと他チーム登録済みの App ID と
    # 衝突して自動署名が失敗しうる)。同期相手: Sources/FTBridgeClient/BridgeLauncher.swift
    FT_BUNDLE_ID_PREFIX: com.example
targets:
  # UIテストの器になる空のホストアプリ
  FTesterRunnerApp:
    type: application
    platform: iOS
    sources:
      - path: FTesterRunnerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FT_BUNDLE_ID_PREFIX).ftrunner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  # HTTPサーバ内蔵の常駐UIテスト(ブリッジ本体)
  FTesterRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FTesterRunnerUITests
      # ホスト(macOS CLI)と共有するAPI型・純粋ロジック。Foundation のみに依存すること。
      # 追加したら BridgeSourceSet.xcuitest の explicitFiles にも載せる(片方だけ変えない)
      - path: ../Sources/FTCore/BridgeDTO.swift
      - path: ../Sources/FTCore/TypeReadback.swift
    dependencies:
      - target: FTesterRunnerApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FT_BUNDLE_ID_PREFIX).ftrunner.uitests
        TEST_TARGET_NAME: FTesterRunnerApp
        SWIFT_OBJC_BRIDGING_HEADER: FTesterRunnerUITests/BridgingHeader.h

  # 検証用のテスト対象アプリ
  SampleApp:
    type: application
    platform: iOS
    sources:
      - path: ../SampleApp/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FT_BUNDLE_ID_PREFIX).sampleapp
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

schemes:
  FTesterRunner:
    build:
      targets:
        FTesterRunnerApp: all
        FTesterRunnerUITests: all
    test:
      targets:
        - FTesterRunnerUITests
      environmentVariables:
        # build-for-testing 時に xctestrun へ焼き込まれる
        - variable: FT_PORT
          value: "8123"
          isEnabled: true
  SampleApp:
    build:
      targets:
        SampleApp: all
