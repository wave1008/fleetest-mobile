name: FTE2EIOS
options:
  bundleIdPrefix: com.ftester
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.0"

targets:
  FTE2EIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FT E2E iOS
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ディープリンク(全 SUT 共通契約。E2EAppCMP/docs/ui-contract.md §ディープリンク)。
        # Universal Links は使わない(AASA 取得状態に依存するため)。
        CFBundleURLTypes:
          - CFBundleURLName: com.ftester.e2e.ios
            CFBundleURLSchemes:
              - fte2eios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftester.e2e.ios
        PRODUCT_NAME: FTE2EIOS
        GENERATE_INFOPLIST_FILE: NO
